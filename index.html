<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재미있는 한국어 공부</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="badge">Korean Study</div>
      <h1>🌈 재미있는 한국어 공부</h1>
      <p>중국어로 쉽고 재미있게 배우는 한국어</p>
    </header>

    <section class="card">
      <h2>⭐ 레벨을 선택하세요</h2>
      <div class="levels">
        <button class="level active" data-level="1">🐣 레벨 1<br><small>처음 배우는 한국어</small></button>
        <button class="level" data-level="2">🌱 레벨 2<br><small>쉬운 단어와 문장</small></button>
        <button class="level" data-level="3">🦊 레벨 3<br><small>조금 더 어려운 한국어</small></button>
      </div>
    </section>

    <section class="card">
      <h2>📚 공부할 내용을 선택하세요</h2>
      <div class="choices">
        <button class="choice" data-section="words">📖 단어 공부하기</button>
        <button class="choice" data-section="sentences">💬 문장 공부하기</button>
        <button class="choice" data-section="quiz">🎯 퀴즈 풀기</button>
      </div>
      <div id="content" class="content">
        <div class="welcome">위에서 레벨과 공부할 내용을 선택해 보세요! 😊</div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
